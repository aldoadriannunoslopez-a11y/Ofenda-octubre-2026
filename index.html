<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realidad Aumentada</title>

    <!-- Librería A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Librería MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* Nombre en la parte inferior derecha */
        #nombreUsuario {
            position: fixed;
            bottom: 12px;
            right: 10px;
            z-index: 9999;

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            /* Tamaño pequeño y adaptable */
            font-size: clamp(10px, 2.5vw, 16px);
            font-weight: bold;
            text-align: right;

            /* Sombra para que se lea sobre cualquier imagen */
            text-shadow:
                -1px -1px 2px black,
                 1px -1px 2px black,
                -1px  1px 2px black,
                 1px  1px 2px black;

            /* Fondo discreto */
            background: rgba(0, 0, 0, 0.45);
            padding: 5px 8px;
            border-radius: 6px;

            /* Evitar que el nombre se salga de la pantalla */
            max-width: calc(100vw - 30px);
            box-sizing: border-box;
            overflow-wrap: anywhere;

            pointer-events: none;
            display: none;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Nombre del autor -->
    <div id="nombreUsuario">
        Aldo Adrián Nuño López
    </div>

    <!-- Escena de realidad aumentada -->
    <a-scene
        mindar-image="
            imageTargetSrc: targets.mind;
            filterMinCF: 0.001;
            filterBeta: 0.01;
            missTolerance: 150;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Recursos de imágenes -->
        <a-assets>
            <img id="muralFondo" src="aldo.jpeg">
            <img id="diabloVerde" src="verde.png">
        </a-assets>

        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- Objetivo de realidad aumentada -->
        <a-entity
            id="objetivoAR"
            mindar-image-target="targetIndex: 0">

            <!-- Capa 1: Imagen de fondo -->
            <a-image
                src="#muralFondo"
                position="0 0 0"
                width="3"
                height="2.4"
                material="shader: flat; color: #FFF;">
            </a-image>

            <!-- Capa 2: Diablo verde -->
            <a-image
                src="#diabloVerde"
                position="0 0 0.2"
                width="3"
                height="2.4"
                material="
                    shader: flat;
                    color: #FFF;
                    transparent: true;
                ">
            </a-image>

        </a-entity>

    </a-scene>

    <script>
        // Obtener los elementos
        const objetivoAR = document.getElementById("objetivoAR");
        const nombreUsuario = document.getElementById("nombreUsuario");

        // Mostrar el nombre cuando se detecte la imagen
        objetivoAR.addEventListener("targetFound", function () {
            nombreUsuario.style.display = "block";
        });

        // Ocultar el nombre cuando se pierda la imagen
        objetivoAR.addEventListener("targetLost", function () {
            nombreUsuario.style.display = "none";
        });
    </script>

</body>
</html>
