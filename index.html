<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
    <!-- Configuración estable al máximo para evitar temblores -->
    <a-scene
        mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 150;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="muralFondo" src="aldo.jpeg">
            <!-- Actualizado para leer tu archivo PNG -->
            <img id="diabloVerde" src="verde.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <!-- Capa 1: El fondo pegado a la pared -->
            <a-image
                src="#muralFondo"
                position="0 0 0"
                width="3"
                height="2.4"
                material="shader: flat; color: #FFF;">
            </a-image>

            <!-- Capa 2: El diablo verde flotando hacia ti (Z = 0.2). Se activa la transparencia para el PNG -->
            <a-image
                src="#diabloVerde"
                position="0 0 0.2"
                width="3"
                height="2.4"
                material="shader: flat; color: #FFF; transparent: true;">
            </a-image>

        </a-entity>

    </a-scene>
</body>
</html>
